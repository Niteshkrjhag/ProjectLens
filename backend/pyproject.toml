[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectlens-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "google-genai==2.20.0",
  "ollama==0.6.2",
  "psycopg[binary]==3.3.4",
  "pgvector==0.5.0",
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.20",
  "mcp==2.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
markers = ["live: opt-in tests that call configured external services"]

[tool.setuptools.packages.find]
where = ["src"]
