services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: projectlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectlens
      POSTGRES_USER: projectlens
      POSTGRES_PASSWORD: projectlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectlens -d projectlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PROJECTLENS_STORAGE_URL: ${PROJECTLENS_STORAGE_URL:-postgresql://projectlens:projectlens@postgres:5432/projectlens}
      DATABASE_URL: ${DATABASE_URL:-postgresql://projectlens:projectlens@postgres:5432/projectlens}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_INPUT_COST_PER_MILLION: ${GEMINI_INPUT_COST_PER_MILLION:-0}
      GEMINI_OUTPUT_COST_PER_MILLION: ${GEMINI_OUTPUT_COST_PER_MILLION:-0}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b-cloud}
      PROJECTLENS_LLM_MODE: ${PROJECTLENS_LLM_MODE:-offline}
      PROJECTLENS_LLM_PROVIDER: ${PROJECTLENS_LLM_PROVIDER:-auto}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
